<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Happy Birthday</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; }

    /*@media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: infinite !important;
        transition-duration: 0.01ms !important;
      }
    }*/

    body {
      background: #05060a;
      color: #fff;
      font-family: 'Segoe UI', system-ui, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #nebula {
      position: fixed;
      inset: -30%;
      z-index: 0;
      pointer-events: none;
      background:
        radial-gradient(circle at 25% 35%, rgba(80, 40, 140, 0.32) 0%, transparent 55%),
        radial-gradient(circle at 75% 25%, rgba(140, 60, 100, 0.26) 0%, transparent 50%),
        radial-gradient(circle at 55% 75%, rgba(50, 110, 140, 0.38) 0%, transparent 55%),
        radial-gradient(circle at 35% 70%, rgba(90, 60, 150, 0.14) 0%, transparent 50%);
      filter: blur(70px);
      animation: nebulaDrift 60s ease-in-out infinite alternate;
      opacity: 0.9;
    }
    @keyframes nebulaDrift {
      0% { transform: translate(0, 0) scale(1) rotate(0deg); }
      33% { transform: translate(5%, 4%) scale(1.06) rotate(2deg); }
      66% { transform: translate(-4%, 5%) scale(1.03) rotate(-2deg); }
      100% { transform: translate(-2%, -3%) scale(1.05) rotate(1deg); }
    }

    #starfield { position: fixed; inset: 0; z-index: 0; pointer-events: none; }
    .star {
      position: absolute;
      border-radius: 50%;
      background: #fff;
      opacity: 0;
      animation: twinkle var(--duration) ease-in-out infinite;
      animation-delay: var(--delay);
    }
    @keyframes twinkle {
      0%, 100% { opacity: 0.15; transform: scale(0.8); }
      50% { opacity: 1; transform: scale(1.2); box-shadow: 0 0 8px rgba(255,255,255,0.8); }
    }

    #photoLayer {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      opacity: 0;
      transition: opacity 2s ease;
    }
    #photoLayer.visible { opacity: 1; }
    .photoCard {
      position: absolute;
      max-width: 42vw;
      max-height: 62vh;
      border-radius: 18px;
      background-size: contain;
      background-repeat: no-repeat;
      background-position: center;
      opacity: 0;
      filter: blur(2px) saturate(1.1);
      transition: opacity 1.5s ease-in-out;
      transform: translate(-50%, -50%);
    }
    .photoCard.visible { opacity: 0.3; }

    #envelopeWrapper { opacity: 0; transform: scale(0.9); transition: opacity 3s ease, transform 3s ease; }
    #envelopeWrapper.show { opacity: 1; transform: scale(1); }

    #envelope {
      width: clamp(140px, 45vw, 260px);
      height: auto;
      cursor: pointer;
      filter: drop-shadow(0 0 25px rgba(255,255,255,0.25));
      transition: transform 0.3s ease, filter 0.3s ease;
    }
    #envelope:hover { transform: scale(1.05); filter: drop-shadow(0 0 35px rgba(255,255,255,0.4)); }
    #envelope.tapped { transform: scale(0.95); }

    #tapHint {
      margin-top: 18px;
      font-size: clamp(1rem, 3vw, 1.35rem);
      letter-spacing: 0.08em;
      opacity: 0.85;
      text-shadow: 0 0 10px rgba(255,255,255,0.3);
      animation: pulse 2.5s ease-in-out infinite;
    }
    @keyframes pulse { 0%,100% { opacity: 0.65; } 50% { opacity: 1; } }

    #messageBox {
      position: fixed;
      inset: 0;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      pointer-events: none;
      opacity: 0;
      transition: opacity 1s ease;
    }
    #messageBox.active { pointer-events: auto; opacity: 1; }

    #messageText {
      font-size: clamp(1.6rem, 6vw, 3.2rem);
      line-height: 1.3;
      max-width: 800px;
      font-weight: 300;
      text-shadow: 0 0 20px rgba(255,255,255,0.35), 0 0 40px rgba(255,200,220,0.2);
      opacity: 0;
      transform: translateY(16px);
      transition: opacity 1.8s ease, transform 1.8s ease;
    }
    #messageText.visible { opacity: 1; transform: translateY(0); }

    #endHint {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 3;
      font-size: clamp(0.8rem, 2.5vw, 1rem);
      opacity: 0;
      transition: opacity 1s ease;
      pointer-events: none;
    }
    #endHint.show { opacity: 0.6; }
  </style>
</head>
<body>
  <div id="nebula"></div>
  <div id="photoLayer">
    <div class="photoCard" data-slot="0"></div>
    <div class="photoCard" data-slot="1"></div>
    <div class="photoCard" data-slot="2"></div>
  </div>
  <div id="starfield"></div>

  <div id="scene">
    <div id="envelopeWrapper">
      <svg id="envelope" viewBox="0 0 200 160" xmlns="http://www.w3.org/2000/svg" aria-label="Mail icon">
        <defs>
          <linearGradient id="flapGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#ffdde1" />
            <stop offset="100%" stop-color="#ee9ca7" />
          </linearGradient>
          <linearGradient id="bodyGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#ff9a9e" />
            <stop offset="100%" stop-color="#fecfef" />
          </linearGradient>
        </defs>
        <rect x="10" y="60" width="180" height="90" rx="12" fill="url(#bodyGrad)" />
        <path d="M10 60 L100 120 L190 60" fill="url(#flapGrad)" stroke="rgba(255,255,255,0.4)" stroke-width="1"/>
        <path d="M10 150 L70 100 L100 120 L130 100 L190 150" fill="none" stroke="rgba(255,255,255,0.35)" stroke-width="1.5"/>
        <circle cx="170" cy="45" r="10" fill="#ff6b81" />
      </svg>
      <div id="tapHint">click to open message</div>
    </div>
  </div>

  <div id="messageBox">
    <div id="messageText"></div>
  </div>
  <div id="endHint">Tap to continue</div>

  <audio id="bgMusic" src="cityofstars.weba" loop></audio>

  <script src="messages.js"></script>
  <script>
    const starfield = document.getElementById('starfield');
    const envelopeWrapper = document.getElementById('envelopeWrapper');
    const envelope = document.getElementById('envelope');
    const tapHint = document.getElementById('tapHint');
    const messageBox = document.getElementById('messageBox');
    const messageText = document.getElementById('messageText');
    const endHint = document.getElementById('endHint');
    const music = document.getElementById('bgMusic');

    const photos = [
      "img/DSC02236.webp", "img/IMG_20250813_130339_196.webp", "img/DSC02189.webp",
      "img/DSC02171.webp", "img/DSC02165.webp", "img/DSC02153.webp", "img/DSC02144.webp",
      "img/DSC02119.webp", "img/DSC02371.webp", "img/DSC02353.webp", "img/DSC02350.webp",
      "img/DSC02346.webp", "img/DSC02343.webp", "img/DSC02305.webp", "img/DSC02294.webp",
      "img/DSC02268.webp", "img/DSC02252.webp", "img/DSC02248.webp", "img/DSC02239.webp",
      "img/DSC03477.webp", "img/DSC03470.webp", "img/DSC03455.webp", "img/DSC02386.webp",
      "img/DSC02383.webp", "img/IMG_20250114_143035_773.webp", "img/IMG_20250114_143009_489.webp",
      "img/DSC03480.webp", "img/IMG_20250114_143118_874.webp", "img/IMG_20250707_151102_992.webp",
      "img/DSC01233.webp", "img/DSC01305.webp", "img/DSC01338.webp", "img/DSC01260.webp",
      "img/DSC02105.webp", "img/DSC01295.webp"
    ];

    function preloadImages(urls) {
      urls.forEach(src => {
        const img = new Image();
        img.src = src;
      });
    }
    preloadImages(photos);

    const photoLayer = document.getElementById('photoLayer');
    const slots = document.querySelectorAll('.photoCard');
    const slotState = [{ img: null, x: 0, y: 0, w: 0, h: 0 }, { img: null, x: 0, y: 0, w: 0, h: 0 }, { img: null, x: 0, y: 0, w: 0, h: 0 }];

    function overlapTooMuch(a, b) {
      const dx = Math.abs(a.x - b.x);
      const dy = Math.abs(a.y - b.y);
      const minW = Math.min(a.w, b.w) * 0.55;
      const minH = Math.min(a.h, b.h) * 0.55;
      return dx < minW && dy < minH;
    }

    function randomRange(min, max) { return min + Math.random() * (max - min); }

    function placeCard(i) {
      const vw = window.innerWidth;
      const vh = window.innerHeight;
      const w = randomRange(Math.min(260, vw * 0.28), Math.min(520, vw * 0.48));
      const h = randomRange(Math.min(320, vh * 0.35), Math.min(700, vh * 0.65));
      let attempts = 0;
      let x, y;
      do {
        x = randomRange(vw * 0.25, vw * 0.75);
        y = randomRange(vh * 0.2, vh * 0.8);
        slotState[i].x = x;
        slotState[i].y = y;
        slotState[i].w = w;
        slotState[i].h = h;
        attempts++;
      } while (attempts < 60 && ([0, 1, 2].filter(j => j !== i).some(j => overlapTooMuch(slotState[i], slotState[j]))));

      const card = slots[i];
      card.style.width = w + 'px';
      card.style.height = h + 'px';
      card.style.left = x + 'px';
      card.style.top = y + 'px';
    }

    function randomPhoto(exclude) {
      let p;
      do { p = photos[Math.floor(Math.random() * photos.length)]; }
      while (exclude.includes(p));
      return p;
    }

    function changeSlot(i) {
      const exclude = [slotState[(i + 1) % 3].img, slotState[(i + 2) % 3].img].filter(Boolean);
      const next = randomPhoto(exclude);
      slots[i].style.backgroundImage = `url('${next}')`;
      slotState[i].img = next;
    }

    function scheduleSlot(i) {
      const showDelay = 3000 + Math.random() * 7000;
      setTimeout(() => {
        slots[i].classList.remove('visible');
        setTimeout(() => {
          placeCard(i);
          changeSlot(i);
          requestAnimationFrame(() => {
            slots[i].classList.add('visible');
          });
          scheduleSlot(i);
        }, 1600);
      }, showDelay);
    }

    function revealPhotos() {
      [0, 1, 2].forEach(i => placeCard(i));
      slots.forEach((slot, i) => {
        changeSlot(i);
        setTimeout(() => slot.classList.add('visible'), 100);
        scheduleSlot(i);
      });
      photoLayer.classList.add('visible');
    }

    function makeStars(count) {
      for (let i = 0; i < count; i++) {
        const s = document.createElement('div');
        s.className = 'star';
        const size = Math.random() * 2.2 + 0.8;
        s.style.width = size + 'px';
        s.style.height = size + 'px';
        s.style.left = Math.random() * 100 + 'vw';
        s.style.top = Math.random() * 100 + 'vh';
        s.style.setProperty('--duration', (Math.random() * 2 + 2) + 's');
        s.style.setProperty('--delay', (Math.random() * 4) + 's');
        starfield.appendChild(s);
      }
    }
    makeStars(180);

    let index = 0;
    let started = false;

    function showMessage() {
      messageText.classList.remove('visible');
      setTimeout(() => {
        messageText.textContent = messages[index];
        messageText.classList.add('visible');
      }, 200);
    }

    function advance() {
      if (!started) return;
      if (index < messages.length - 1) {
        index++;
        showMessage();
      } else {
        messageText.classList.remove('visible');
        setTimeout(() => {
          messageText.textContent = "happy birthday, my love";
          messageText.classList.add('visible');
        }, 200);
      }
    }

    envelope.addEventListener('click', () => {
      if (started) return;
      started = true;
      envelope.classList.add('tapped');
      tapHint.style.opacity = 0;
      music.volume = 0.6;
      music.play().catch(() => {});

      setTimeout(() => {
        envelopeWrapper.style.opacity = 0;
        envelopeWrapper.style.transform = 'scale(1.1)';
        revealPhotos();
        messageBox.classList.add('active');
        setTimeout(() => endHint.classList.add('show'), 1200);
        showMessage();
      }, 400);
    });

    messageBox.addEventListener('click', advance);

    window.addEventListener('DOMContentLoaded', () => {
      setTimeout(() => envelopeWrapper.classList.add('show'), 500);
    });
  </script>
</body>
</html>
